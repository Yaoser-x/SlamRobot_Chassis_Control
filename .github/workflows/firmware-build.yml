name: Firmware Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Configure ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build ${{ matrix.preset }}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Memory report ${{ matrix.preset }}
        run: |
          ELF="build/${{ matrix.preset }}/F407_V2.0.elf"
          echo "### ${{ matrix.preset }} Memory Usage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          arm-none-eabi-size "$ELF" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.preset }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.preset }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/${{ matrix.preset }}/F407_V2.0.elf
            build/${{ matrix.preset }}/F407_V2.0.map
