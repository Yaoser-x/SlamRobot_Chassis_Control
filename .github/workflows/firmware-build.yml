name: Firmware Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi
          echo "--- Toolchain versions ---"
          arm-none-eabi-gcc --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Configure ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build ${{ matrix.preset }}
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Generate ${{ matrix.preset }} hex/bin
        run: |
          ELF="build/${{ matrix.preset }}/F407_V2.0.elf"
          arm-none-eabi-objcopy -O ihex "$ELF" "build/${{ matrix.preset }}/F407_V2.0.hex"
          arm-none-eabi-objcopy -O binary "$ELF" "build/${{ matrix.preset }}/F407_V2.0.bin"

      - name: Enforce firmware size limit
        run: |
          BIN="build/${{ matrix.preset }}/F407_V2.0.bin"
          ELF="build/${{ matrix.preset }}/F407_V2.0.elf"
          MAX_BYTES=245760
          MAX_RAM_BYTES=114688
          ACTUAL_BYTES=$(stat -c%s "$BIN")
          read TEXT_BYTES DATA_BYTES BSS_BYTES _ < <(arm-none-eabi-size "$ELF" | tail -1)
          RAM_BYTES=$((DATA_BYTES + BSS_BYTES))
          echo "Firmware size: ${ACTUAL_BYTES}/${MAX_BYTES} bytes"
          echo "Firmware RAM: ${RAM_BYTES}/${MAX_RAM_BYTES} bytes"
          test "$ACTUAL_BYTES" -le "$MAX_BYTES"
          test "$RAM_BYTES" -le "$MAX_RAM_BYTES"

      - name: Memory report ${{ matrix.preset }}
        run: |
          ELF="build/${{ matrix.preset }}/F407_V2.0.elf"
          echo "### ${{ matrix.preset }} Memory Usage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          arm-none-eabi-size "$ELF" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.preset }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.preset }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/${{ matrix.preset }}/F407_V2.0.elf
            build/${{ matrix.preset }}/F407_V2.0.hex
            build/${{ matrix.preset }}/F407_V2.0.bin
            build/${{ matrix.preset }}/F407_V2.0.map

  host-tests:
    name: Host Tests
    runs-on: ubuntu-24.04
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build
          echo "--- Toolchain versions ---"
          cmake --version | head -1
          ninja --version

      - name: Configure host tests
        run: cmake -S tests/host -B build/host-tests-ninja -G Ninja

      - name: Build host tests
        run: cmake --build build/host-tests-ninja

      - name: Run host tests
        run: ctest --test-dir build/host-tests-ninja --output-on-failure

      - name: Check CubeMX safety configuration
        run: python scripts/check_generated_safety_config.py

      - name: Host test summary
        if: always()
        run: |
          echo "### Host Tests" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/host-tests-ninja/Testing/TAG ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ctest --test-dir build/host-tests-ninja --output-on-failure 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test results found (build likely failed)." >> "$GITHUB_STEP_SUMMARY"
          fi

  format-check:
    name: Format Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Five-layer architecture check
        run: python3 scripts/check_architecture_dependencies.py

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: clang-format dry run
        run: |
          files=$(git ls-files 'App/*.c' 'App/*.h' 'BSP/*.c' 'BSP/*.h' 'Domain/*.c' 'Domain/*.h' 'Platform/*.c' 'Platform/*.h' 'Service/*.c' 'Service/*.h' 'tests/host/*.c' 'tests/host/*.h')
          if [ -n "$files" ]; then
            echo "$files" | xargs clang-format --dry-run --Werror
          else
            echo "No five-layer/tests C/H files."
          fi

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: Run cppcheck
        run: |
          files=$(git ls-files 'App/*.c' 'App/*.h' 'BSP/*.c' 'BSP/*.h' 'Domain/*.c' 'Domain/*.h' 'Platform/*.c' 'Platform/*.h' 'Service/*.c' 'Service/*.h' 'tests/host/*.c' 'tests/host/*.h')
          if [ -n "$files" ]; then
            cppcheck --enable=warning --error-exitcode=1 \
              --suppress=missingIncludeSystem \
              --suppress=unusedFunction \
              --inline-suppr \
              $files
          else
            echo "No five-layer/tests C/H files."
          fi

  esp8266-build:
    name: ESP8266 Bridge (Core 3.1.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
      - name: Install locked toolchain and library
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install WebSockets@2.7.2
      - name: Compile ESP8266 firmware
        run: arduino-cli compile --fqbn esp8266:esp8266:generic firmware/esp12f/F407_ESP12F
      - name: Check ESP safety and embedded page
        run: |
          python firmware/esp12f/F407_ESP12F/tools/check_ap_only.py
          python firmware/esp12f/F407_ESP12F/tools/check_esp_safety_policy.py
